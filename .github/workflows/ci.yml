name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            g++ \
            libeigen3-dev \
            libgmsh-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            g++ \
            libeigen3-dev \
            libgmsh-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: |
          cmake --build build-sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --test-dir build-sanitizers \
            --output-on-failure

  code-quality:
    name: Code quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-format \
            clang-tidy \
            cmake \
            g++ \
            libeigen3-dev \
            libgmsh-dev

      - name: Check formatting
        run: |
          find include src tests verification \
            -type f \
            \( -name "*.hpp" -o -name "*.cpp" \) \
            -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure for clang-tidy
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_VERIFICATION=ON

      - name: Run clang-tidy
        run: |
          find src tests verification \
            -type f \
            -name "*.cpp" \
            -print0 \
            | xargs -0 -n1 clang-tidy \
                -p build \
                --header-filter="^${GITHUB_WORKSPACE}/(include|src|tests|verification)/" \
                --warnings-as-errors="*"
