name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            g++ \
            libeigen3-dev \
            libgmsh-dev \
            python3-venv

      - name: Install CAD dependencies in an isolated Python environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/cad-venv"
          "${RUNNER_TEMP}/cad-venv/bin/python" -m pip install -r tools/requirements-cad.txt
          echo "CAD_PYTHON=${RUNNER_TEMP}/cad-venv/bin/python" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DPython3_EXECUTABLE="$CAD_PYTHON"

      - name: Require RPA test registration
        run: |
          "$CAD_PYTHON" - <<'PY'
          import json
          import subprocess
          import sys

          listing = subprocess.check_output(
              ["ctest", "--test-dir", "build", "--show-only=json-v1"], text=True)
          required = {"rpa_nozzle", "rpa_nozzle_integration", "rpa_dxf_import"}
          enabled = {
              test["name"] for test in json.loads(listing)["tests"]
              if not any(p["name"] == "DISABLED" and p["value"]
                         for p in test.get("properties", []))
          }
          missing = required - enabled
          if missing:
              sys.exit("Required RPA tests missing or disabled: " + ", ".join(sorted(missing)))
          print("Required RPA tests registered and enabled: " + ", ".join(sorted(required)))
          PY

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run tests
        run: |
          ctest \
            --test-dir build \
            --no-tests=error \
            --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            g++ \
            libeigen3-dev \
            libgmsh-dev \
            python3-venv

      - name: Install CAD dependencies in an isolated Python environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/cad-venv"
          "${RUNNER_TEMP}/cad-venv/bin/python" -m pip install -r tools/requirements-cad.txt
          echo "CAD_PYTHON=${RUNNER_TEMP}/cad-venv/bin/python" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DPython3_EXECUTABLE="$CAD_PYTHON" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Require RPA test registration
        run: |
          "$CAD_PYTHON" - <<'PY'
          import json
          import subprocess
          import sys

          listing = subprocess.check_output(
              ["ctest", "--test-dir", "build-sanitizers", "--show-only=json-v1"], text=True)
          required = {"rpa_nozzle", "rpa_nozzle_integration", "rpa_dxf_import"}
          enabled = {
              test["name"] for test in json.loads(listing)["tests"]
              if not any(p["name"] == "DISABLED" and p["value"]
                         for p in test.get("properties", []))
          }
          missing = required - enabled
          if missing:
              sys.exit("Required RPA tests missing or disabled: " + ", ".join(sorted(missing)))
          print("Required RPA tests registered and enabled: " + ", ".join(sorted(required)))
          PY

      - name: Build
        run: |
          cmake --build build-sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --test-dir build-sanitizers \
            --no-tests=error \
            --output-on-failure

  code-quality:
    name: Code quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-format \
            clang-tidy \
            cmake \
            g++ \
            libeigen3-dev \
            libgmsh-dev \
            python3-venv

      - name: Install CAD dependencies in an isolated Python environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/cad-venv"
          "${RUNNER_TEMP}/cad-venv/bin/python" -m pip install -r tools/requirements-cad.txt
          echo "CAD_PYTHON=${RUNNER_TEMP}/cad-venv/bin/python" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          find include src tests verification \
            -type f \
            \( -name "*.hpp" -o -name "*.cpp" \) \
            -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure for clang-tidy
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_VERIFICATION=ON \
            -DPython3_EXECUTABLE="$CAD_PYTHON"

      - name: Require RPA test registration
        run: |
          "$CAD_PYTHON" - <<'PY'
          import json
          import subprocess
          import sys

          listing = subprocess.check_output(
              ["ctest", "--test-dir", "build", "--show-only=json-v1"], text=True)
          required = {"rpa_nozzle", "rpa_nozzle_integration", "rpa_dxf_import"}
          enabled = {
              test["name"] for test in json.loads(listing)["tests"]
              if not any(p["name"] == "DISABLED" and p["value"]
                         for p in test.get("properties", []))
          }
          missing = required - enabled
          if missing:
              sys.exit("Required RPA tests missing or disabled: " + ", ".join(sorted(missing)))
          print("Required RPA tests registered and enabled: " + ", ".join(sorted(required)))
          PY

      - name: Run clang-tidy
        run: |
          find src tests verification \
            -type f \
            -name "*.cpp" \
            -print0 \
            | xargs -0 -n1 clang-tidy \
                -p build \
                --header-filter="^${GITHUB_WORKSPACE}/(include|src|tests|verification)/" \
                --warnings-as-errors="*"
